[package]
name = "nkdhr-settings"
description = "System settings application, front-end to the nkdhrd config store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nkdhr-render = { version = "0.1.0", path = "../nkdhr-render" }
nkdhr-theme = { version = "0.1.0", path = "../nkdhr-theme" }
nkdhr-ui = { version = "0.1.0", path = "../nkdhr-ui" }
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "renderer_gl"] }
wayland-egl = "0.32.11"

[dependencies.serde_json]
version = "1.0.151"

[dev-dependencies]
cosmic-text = { version = "0.19.0", features = ["shape-run-cache"] }
