[package]
name = "nkdhrd"
description = "Control-plane daemon: aggregates system services and owns the config store, exposed over D-Bus as org.nkdhr.*"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
inotify = { version = "0.11.4", default-features = false }
nkdhr-ipc = { version = "0.1.0", path = "../nkdhr-ipc" }
pipewire = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
zbus = "5.18.0"
