[package]
name = "nkdhr-ui"
description = "Widget toolkit built on nkdhr-render; runs as in-compositor scene nodes and as a standalone Wayland client library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cosmic-text = { version = "0.19.0", features = ["shape-run-cache"] }
nkdhr-render = { version = "0.1.0", path = "../nkdhr-render" }
nkdhr-theme = { version = "0.1.0", path = "../nkdhr-theme" }
nkdhr-ipc = { version = "0.1.0", path = "../nkdhr-ipc" }
oxitext-raster = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-segmentation = "1.13.3"
zbus = "5.18.0"
